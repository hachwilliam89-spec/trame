name: Publication des images

# US-005 B1, issue #44 : publier les six images de la tête de main, scannées, signées et
# vérifiables. Rien n'est déployé ici : le staging (B2) lit le manifeste de version signé.
#
# Déclenché au push sur main, et non par workflow_run : le commit publié est exactement celui du
# push et du jeton OIDC qui signe. Le gate attend lui-même la fin de la CI et de CodeQL.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: publish-images-${{ github.sha }}
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  LEFTHOOK: '0'

jobs:
  gate:
    name: Admissibilité
    runs-on: ubuntu-24.04
    # Le gate attend au plus 60 minutes la fin de la CI et des analyses CodeQL du commit.
    timeout-minutes: 70
    permissions:
      contents: read
      checks: read
      security-events: read
    outputs:
      publish: ${{ steps.gate.outputs.publish }}
      commit: ${{ steps.gate.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python: 'false'
          cache: 'false'

      - uses: $/.github/actions/release-tools

      - id: gate
        name: Contrôle d'admissibilité
        env:
          GH_TOKEN: ${{ github.token }}
        run: pnpm release-images gate

  build:
    name: Construction et scan (${{ matrix.name }})
    needs: gate
    if: needs.gate.outputs.publish == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    strategy:
      # Une image refusée suffit à arrêter la publication : aucune ne sera poussée.
      fail-fast: true
      matrix:
        include:
          - { name: api, dockerfile: infra/docker/node.Dockerfile, target: api }
          - { name: relay, dockerfile: infra/docker/node.Dockerfile, target: relay }
          - { name: migrator, dockerfile: infra/docker/node.Dockerfile, target: migrator }
          - { name: web, dockerfile: infra/docker/node.Dockerfile, target: web }
          - { name: engine, dockerfile: infra/docker/engine.Dockerfile, target: engine }
          - { name: worker, dockerfile: infra/docker/engine.Dockerfile, target: worker }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python: 'false'
          cache: 'false'

      - uses: $/.github/actions/release-tools

      - name: Builder BuildKit et générateur SBOM figés (infra/release/pins.env)
        run: infra/release/prepare-builder.sh

      - name: Registre local du scan
        run: infra/release/scan-registry.sh

      - name: Construire, scanner et vérifier les attestations
        env:
          BUILDER: trame-release
          SCAN_REGISTRY: 127.0.0.1:5000
          REVISION: ${{ needs.gate.outputs.commit }}
          IMAGE_NAME: ${{ matrix.name }}
          DOCKERFILE: ${{ matrix.dockerfile }}
          TARGET: ${{ matrix.target }}
        run: infra/release/build-and-scan.sh "$IMAGE_NAME" "$DOCKERFILE" "$TARGET" "$RUNNER_TEMP/scanned"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: layout-${{ matrix.name }}
          path: ${{ runner.temp }}/scanned
          retention-days: 7
          if-no-files-found: error

  publish:
    name: Publication, signature et manifeste de version
    needs: [gate, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # Seul job avec des droits d'écriture : il ne s'exécute qu'après les six scans réussis.
    permissions:
      contents: read
      packages: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python: 'false'
          cache: 'false'

      - uses: $/.github/actions/release-tools

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: layout-*
          path: ${{ runner.temp }}/layouts
          merge-multiple: true

      - name: Connexion à GHCR
        env:
          REGISTRY_TOKEN: ${{ github.token }}
          REGISTRY_USER: ${{ github.actor }}
        run: echo "$REGISTRY_TOKEN" | oras login ghcr.io --username "$REGISTRY_USER" --password-stdin

      - name: Publier, signer, vérifier, puis publier le manifeste de version
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ needs.gate.outputs.commit }}
        run: pnpm release-images publish "$COMMIT" "$RUNNER_TEMP/layouts"
