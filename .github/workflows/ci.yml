name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  # Les hooks Git n'ont pas de sens en CI.
  LEFTHOOK: '0'

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      # nx-set-shas cherche le dernier run réussi sur main.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: $/.github/actions/setup

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Lint, typecheck, tests et build des projets touchés
        run: pnpm nx affected -t lint typecheck test build --base="$NX_BASE" --head="$NX_HEAD"

      - name: Formatage (Prettier)
        run: pnpm nx format:check --base="$NX_BASE" --head="$NX_HEAD"

      - name: Code mort et dépendances inutilisées (Knip)
        run: pnpm knip

  contracts:
    name: Contrats générés à jour
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Modèles Pydantic régénérés depuis zod (ADR-0018)
        run: pnpm nx run contracts:check

  integration:
    name: Intégration (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    services:
      # Base dédiée au contrôle des migrations ; les tests d'intégration démarrent les leurs.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: trame
          POSTGRES_PASSWORD: trame
          POSTGRES_DB: trame
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U trame"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup

      - name: Navigateurs pour les parcours Keycloak et Angular
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Postgres, RabbitMQ et Keycloak réels
        run: pnpm nx run-many -t integration

      # `prisma migrate deploy` applique les migrations, puis `migrate diff` vérifie qu'aucun
      # écart ne reste avec schema.prisma : une migration oubliée ou retouchée fait échouer la CI.
      - name: Migrations appliquées par Prisma, sans écart avec le schéma
        run: pnpm nx run api-database:migrations-check
        env:
          DATABASE_URL: postgresql://trame:trame@localhost:5432/trame

  images:
    name: Images et parcours conteneurisé
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup
        with:
          python: 'false'

      - name: Chromium pour le parcours conteneurisé
        run: pnpm exec playwright install --with-deps chromium

      - name: Construire et tester les images Linux amd64
        run: pnpm nx run infra:images-test

      # Preuve de la publication (US-005 B1) sur un registre local, sans GHCR : le même script que
      # le workflow de publication construit, copie, scanne et vérifie les attestations.
      - uses: $/.github/actions/release-tools

      - name: Builder BuildKit et générateur SBOM figés (infra/release/pins.env)
        run: infra/release/prepare-builder.sh

      - name: Registre local de la preuve
        run: infra/release/scan-registry.sh

      - name: Construire et scanner une image comme la publication
        env:
          BUILDER: trame-release
          SCAN_REGISTRY: 127.0.0.1:5000
          REVISION: ${{ github.sha }}
        run: infra/release/build-and-scan.sh web infra/docker/node.Dockerfile web "$RUNNER_TEMP/proof"

      - name: Signer, vérifier par commit et lire anonymement
        env:
          COMMIT: ${{ github.sha }}
        run: |
          digest="$(cat "$RUNNER_TEMP/proof/web.scanned-digest")"
          infra/release/signature-proof.sh "127.0.0.1:5000/web@$digest" "$COMMIT"

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Dépendances Node (vulnérabilités hautes et critiques)
        run: pnpm audit --audit-level high

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: apps/engine/pyproject.toml

      - name: Dépendances Python du moteur
        working-directory: apps/engine
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements.txt > "$RUNNER_TEMP/engine-requirements.txt"
          uvx pip-audit@2.10.1 --strict --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/engine-requirements.txt"

  workflows:
    name: Audit des workflows (zizmor)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      # renovate: datasource=pypi depName=zizmor
      ZIZMOR_VERSION: 1.31.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Échoue sur tout constat du profil `regular`, quelle que soit sa gravité, avec les audits en
      # ligne (actions vulnérables, commits usurpés, versions incohérentes). Les constats s'affichent
      # en annotations ; le mode Advanced Security, par défaut, les publierait sans faire échouer le job.
      - uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          config: .github/zizmor.yml
          advanced-security: false
          annotations: true

  # Seul check exigé par la protection de main : il agrège tous les autres.
  ci-ok:
    name: CI OK
    if: always()
    needs: [verify, contracts, integration, images, secrets, audit, workflows]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tous les jobs ont réussi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Au moins un job n'a pas réussi."
              exit 1
            fi
          done
