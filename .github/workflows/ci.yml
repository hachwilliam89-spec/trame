name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  NX_DAEMON: 'false'
  NX_NO_CLOUD: 'true'
  # Les hooks Git n'ont pas de sens en CI.
  LEFTHOOK: '0'

jobs:
  verify:
    name: Lint, typecheck, tests, build
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
      # nx-set-shas cherche le dernier run réussi sur main.
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup

      - uses: nrwl/nx-set-shas@e602fada7ad5987b0f7b1905e7a99ea1c661514c # v5.1.0

      - name: Lint, typecheck, tests et build des projets touchés
        run: pnpm nx affected -t lint typecheck test build --base="$NX_BASE" --head="$NX_HEAD"

      - name: Formatage (Prettier)
        run: pnpm nx format:check --base="$NX_BASE" --head="$NX_HEAD"

      - name: Code mort et dépendances inutilisées (Knip)
        run: pnpm knip

  contracts:
    name: Contrats générés à jour
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup

      - name: Modèles Pydantic régénérés depuis zod (ADR-0018)
        run: pnpm nx run contracts:check

  integration:
    name: Intégration (Testcontainers)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          python: 'false'

      - name: Postgres réel via Testcontainers
        run: pnpm nx run api-database:integration

  secrets:
    name: Secrets (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  audit:
    name: Audit des dépendances
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version

      - name: Dépendances Node (vulnérabilités hautes et critiques)
        run: pnpm audit --audit-level high

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version-file: apps/engine/pyproject.toml

      - name: Dépendances Python du moteur
        working-directory: apps/engine
        run: |
          uv export --frozen --no-hashes --no-emit-project --format requirements.txt > "$RUNNER_TEMP/engine-requirements.txt"
          uvx pip-audit@2.10.1 --strict --no-deps --disable-pip --progress-spinner off -r "$RUNNER_TEMP/engine-requirements.txt"

  # Seul check exigé par la protection de main : il agrège tous les autres.
  ci-ok:
    name: CI OK
    if: always()
    needs: [verify, contracts, integration, secrets, audit]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Tous les jobs ont réussi
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Résultats : $RESULTS"
          for result in $RESULTS; do
            if [ "$result" != "success" ]; then
              echo "Au moins un job n'a pas réussi."
              exit 1
            fi
          done
