name: Préparer l'environnement
description: Node et pnpm aux versions du dépôt, uv et l'environnement Python du moteur, dépendances installées.

inputs:
  python:
    description: Installer aussi uv et l'environnement Python du moteur.
    default: 'true'

runs:
  using: composite
  steps:
    # Version lue dans le champ packageManager de package.json.
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      with:
        node-version-file: .node-version
        cache: pnpm

    - name: Dépendances Node
      shell: bash
      run: pnpm install --frozen-lockfile

    # Version lue dans required-version de apps/engine/pyproject.toml.
    - if: inputs.python == 'true'
      uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
      with:
        version-file: apps/engine/pyproject.toml
        enable-cache: true
        cache-dependency-glob: apps/engine/uv.lock

    - if: inputs.python == 'true'
      name: Environnement Python du moteur
      shell: bash
      run: pnpm nx run engine:install
