name: Outils de publication des images
description: >-
  oras, cosign, Trivy et le registre OCI de référence (distribution), téléchargés depuis leurs
  releases officielles et vérifiés par somme de contrôle avant usage.

runs:
  using: composite
  steps:
    - name: Télécharger et vérifier oras, cosign, Trivy et registry
      shell: bash
      # Versions et sommes relevées sur les releases officielles le 2026-11-06 (issue #44).
      # Pas d'action tierce : une étiquette d'action peut être republiée, une somme non.
      env:
        COSIGN_VERSION: v3.1.4
        COSIGN_SHA256: 424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa
        ORAS_VERSION: 1.3.6
        ORAS_SHA256: 66fb0ad7206f3f6fa77ed5b552049d364ccf4b50b1684554f731f76302b52ca0
        TRIVY_VERSION: 0.76.2
        TRIVY_SHA256: bc0fc726e017b8927a62b2d3531d7a84ee01769daf5c99ed866dced54089fdbf
        REGISTRY_VERSION: 3.1.2
        REGISTRY_SHA256: 40df2224d410f72ae425c3371873b078bbdbda3b8b612be9571f0e6751f3acc8
      run: bash "$GITHUB_ACTION_PATH/install.sh"
