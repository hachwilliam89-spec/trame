<a class="skip-link" href="#main">Aller au contenu</a>
<div class="app-window">
  <header class="app-header">
    <picture
      ><source media="(prefers-color-scheme: dark)" srcset="/trame-logo-dark.svg" />
      <img src="/trame-logo.svg" width="127" height="36" alt="Trame"
    /></picture>
    <div class="context">
      <span class="environment">Espace de démonstration</span>@if (session.identity(); as identity)
      {<span class="account">{{ roleLabel() }}</span>}
    </div>
  </header>
  <main id="main" class="main-content">
    @if (session.status() === 'authenticated') {<router-outlet />
    <footer>
      <button type="button" class="text-action" (click)="logout()">Se déconnecter</button>
    </footer>
    } @else if (session.status() === 'loading') {
    <h1>Préparation de votre espace…</h1>
    } @else {
    <tr-landing-page
      [sessionExpired]="session.status() === 'expired'"
      [connectionUnavailable]="session.status() === 'unavailable'"
      (loginRequested)="login()"
    />
    } @if (actionError()) {
    <p class="error" role="alert">{{ actionError() }}</p>
    }
  </main>
</div>
