# Point d'entrée de la répétition du staging (US-005 B2a, étape 4) : le Traefik de vps-edge, même
# image et même configuration, avec les certificats d'une autorité de test. Jamais déployé : sur
# le VPS, ce rôle revient à vps-edge.
#
# Variable : TRAME_REHEARSAL_CERTIFICATES, dossier du certificat et de la clé du serveur.
name: trame-rehearsal-edge

services:
  traefik:
    image: traefik:v3.7@sha256:f4bb143d1135a579b630ed491e17ec50f6f7c9c6a30585ff3d385471d2a86f5a
    ports:
      - '80:80'
      - '443:443'
      - '443:443/udp'
    volumes:
      - ../rehearsal/traefik.yml:/etc/traefik/traefik.yml:ro
      - ../rehearsal/dynamic:/etc/traefik/dynamic:ro
      - ${TRAME_REHEARSAL_CERTIFICATES:?}:/etc/traefik/certificates:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [edge]
    read_only: true
    security_opt: ['no-new-privileges:true']
    mem_limit: 256m
    healthcheck:
      test: ['CMD', 'traefik', 'healthcheck', '--ping']
      interval: 2s
      timeout: 3s
      retries: 30

networks:
  # Sur le VPS, vps-edge crée ce réseau ; ici, la répétition.
  edge:
    name: edge
    external: true
