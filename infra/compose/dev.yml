# Stack de développement local (US-004) : les services dont l'API dépend, sur le poste uniquement.
#
#   pnpm nx run infra:up      démarre, attend que tout soit sain, applique les migrations
#   pnpm nx run infra:down    arrête ; les données restent dans les volumes
#   pnpm nx run infra:reset   supprime aussi les volumes ; relancer ensuite infra:up
#
# Les valeurs viennent du `.env` à la racine (copie de `.env.example`).
name: trame-dev

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1@sha256:3f3c5f8e03c614774b4bd9173b88391fefa4153bfc010d8012d59ad825377332
    command: ['start-dev', '--import-realm']
    environment:
      KC_HEALTH_ENABLED: 'true'
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USER:?}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KEYCLOAK_DEV_REDIRECT_URI: ${KEYCLOAK_DEV_REDIRECT_URI:?}
      KEYCLOAK_DEV_WEB_ORIGIN: ${KEYCLOAK_DEV_WEB_ORIGIN:-http://127.0.0.1:4200}
    ports:
      - '127.0.0.1:${KEYCLOAK_PORT:?}:8080'
    volumes:
      # Pas de volume de données : recréer ce conteneur réimporte le realm de dev.
      - ../keycloak/trame-realm.json:/opt/keycloak/data/import/trame-realm.json:ro
    healthcheck:
      # L'image n'a pas curl. Le port de management reste interne au conteneur.
      test:
        - CMD
        - bash
        - -ec
        - "exec 3<>/dev/tcp/127.0.0.1/9000; printf 'HEAD /health/ready HTTP/1.0\\r\\n\\r\\n' >&3; head -n 1 <&3 | grep -q ' 200 '"
      interval: 2s
      timeout: 5s
      retries: 60

  postgres:
    image: postgres:18.6-alpine@sha256:10a5c69a83035ab5239f5620d708520e8b28f5aa1f2b20143e6024532edadfb5
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      POSTGRES_DB: ${POSTGRES_DB:?}
    ports:
      # 127.0.0.1 : sans adresse, Docker publierait le port sur toutes les interfaces du poste.
      - '127.0.0.1:${POSTGRES_PORT:?}:5432'
    volumes:
      # PostgreSQL 18 range ses données sous /var/lib/postgresql/18 : on monte le dossier parent.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      # Par TCP : pendant l'initialisation, le serveur temporaire n'écoute que sur le socket local,
      # et la base ne doit pas être déclarée saine avant le démarrage définitif.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:4.3.7-management-alpine@sha256:1528a88eebf2bc4d0ab7e9d5d9bc542e9bdf5e1b105e65848fcf8de5c2186528
    # RabbitMQ range ses données sous le nom du nœud, dérivé du nom d'hôte. Fixé, il survit à la
    # recréation du conteneur ; sinon chaque conteneur repartirait d'un nœud vide.
    hostname: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:?}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?}
    ports:
      - '127.0.0.1:${RABBITMQ_PORT:?}:5672'
      - '127.0.0.1:${RABBITMQ_MANAGEMENT_PORT:?}:15672'
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      # Vérifie que les ports AMQP et HTTP acceptent des connexions, pas seulement que le nœud vit.
      test: ['CMD', 'rabbitmq-diagnostics', '--quiet', 'check_port_connectivity']
      interval: 5s
      timeout: 10s
      retries: 20

volumes:
  postgres-data:
  rabbitmq-data:
