# Node 26 est requis (Temporal natif, ADR-0027) : pnpm refuse d'installer avec une autre version.
engineStrict: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
  '@nestjs/core': false
  '@prisma/engines': true
  cpu-features: false
  lefthook: true
  prisma: true
  protobufjs: false
  ssh2: false

# Avis acceptés temporairement par `pnpm audit` en CI (US-003), faute de version corrigée publiée.
# Chaque entrée porte sa justification et sa condition de retrait ; une issue la suit.
# Toutes les autres vulnérabilités hautes et critiques continuent de bloquer.
auditConfig:
  ignoreGhsas:
    # GHSA-fc5q-39xc-vjpf : ReDoS de picomatch <= 4.0.7 par des glob patterns forgés.
    # Aucune version corrigée au 18 novembre 2026 (dernière publiée : 4.0.7).
    # picomatch n'est tiré que par l'outillage de construction et de test (Nx, Vite, Vitest,
    # Jest, Angular CLI, Astro, knip), qui ne reçoit que des patterns écrits dans le dépôt.
    # `pnpm audit --prod` ne le trouve pas : il est absent des images livrées.
    # À retirer dès qu'une version corrigée de picomatch est publiée.
    - GHSA-fc5q-39xc-vjpf

# Correctifs de sécurité imposés aux dépendances transitives (pnpm audit en CI, US-003).
# À retirer quand la dépendance directe embarque elle-même une version corrigée.
overrides:
  # GHSA-587h-7wmj-h5pm : @angular/build 22.2.4 fige vite 8.3.0.
  'vite@>=8.3.0 <8.3.3': 8.3.5
  # GHSA-7589-6fvf-x4pw (CVE-2026-121707) : @prisma/config 7 fige effect 3.20.0, ReDoS corrigé en 3.22.1.
  'effect@<3.22.1': 3.22.5
