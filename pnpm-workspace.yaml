# Node 26 est requis (Temporal natif, ADR-0027) : pnpm refuse d'installer avec une autre version.
engineStrict: true

allowBuilds:
  '@parcel/watcher': true
  '@swc/core': true
  esbuild: true
  lmdb: true
  msgpackr-extract: true
  nx: true
  unrs-resolver: true
  '@nestjs/core': false
  '@prisma/engines': true
  cpu-features: false
  lefthook: true
  prisma: true
  protobufjs: false
  ssh2: false

# Correctifs de sécurité imposés aux dépendances transitives (pnpm audit en CI, US-003).
# À retirer quand la dépendance directe embarque elle-même une version corrigée.
overrides:
  # GHSA-587h-7wmj-h5pm : @angular/build 22.2.4 fige vite 8.3.0.
  'vite@>=8.3.0 <8.3.3': 8.3.5
